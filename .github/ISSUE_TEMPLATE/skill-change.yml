name: Propose a skill or policy change
description: Propose a reviewed, versioned change to the shared framework.
title: "[Change] "
body:
  - type: markdown
    attributes:
      value: "Public proposal only. Do not paste company policies, secrets, private code or customer records."
  - type: textarea
    id: proposal
    attributes:
      label: Problem, proposed scope and skill routes
      description: Explain expected behavior using synthetic examples and identify the owner.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation and licensing plan
      description: List acceptance tests, upstream public license evidence, compatibility and rollback approach.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public sharing review
      options:
        - label: This proposal contains no secrets or private/customer data.
          required: true
