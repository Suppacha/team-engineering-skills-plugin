name: Diagnose v2.2.0 release (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == 'Suppacha/team-engineering-skills-plugin' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: team-plugin-stable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: reader
        with:
          app-id: ${{ vars.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_PRIVATE_KEY }}
          owner: Suppacha
          repositories: team-engineering-skills-plugin
          # Draft visibility requires push access. User approved this existing
          # App scope; diagnose_release.py still rejects every non-GET request.
          permission-contents: write
          permission-actions: read
      - name: Read bounded release metadata (no repair)
        env:
          GH_DIAGNOSTIC_TOKEN: ${{ steps.reader.outputs.token }}
        run: python scripts/diagnose_release.py
