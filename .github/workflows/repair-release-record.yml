name: Repair v2.2.0 release record
run-name: Repair v2.2.0 release record
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# Serialize with normal promotion; never interrupt an uncertain write.
concurrency:
  group: team-plugin-stable-promotion
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'Suppacha/team-engineering-skills-plugin' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: team-plugin-stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: repair
        with:
          app-id: ${{ vars.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_PRIVATE_KEY }}
          owner: Suppacha
          repositories: team-engineering-skills-plugin
          permission-contents: write
          permission-actions: read
      - name: Validate approvals and repair only the missing JSON asset
        env:
          GH_REPAIR_TOKEN: ${{ steps.repair.outputs.token }}
          RELEASE_REVIEWER_ID: ${{ vars.RELEASE_REVIEWER_ID }}
          RELEASE_WRITER_APP_ID: ${{ vars.RELEASE_WRITER_APP_ID }}
          RELEASE_ADMIN_EVIDENCE: ${{ vars.RELEASE_ADMIN_EVIDENCE }}
        run: python scripts/repair_release_record.py
