name: Promote reviewed stable release
run-name: Promote ${{ inputs.candidate_sha }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: team-plugin-stable-promotion
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      expected_stable: ${{ steps.check.outputs.expected_stable }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify immutable candidate before requesting approval
        id: check
        env:
          GH_READ_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python scripts/promote_release.py preflight --candidate "$CANDIDATE_SHA" --output preflight.json
  publish:
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: team-plugin-stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      # App key and all RELEASE_* configuration must be protected-environment
      # scoped. Missing environment/settings never authorize publication.
      # Activation requires Task 6's Admin-reviewed sole-writer protections.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: writer
        with:
          app-id: ${{ vars.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: read
      - name: Revalidate live evidence and publish without candidate execution
        env:
          GH_WRITER_TOKEN: ${{ steps.writer.outputs.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_STABLE: ${{ needs.preflight.outputs.expected_stable }}
          RELEASE_REVIEWER_ID: ${{ vars.RELEASE_REVIEWER_ID }}
          RELEASE_WRITER_APP_ID: ${{ vars.RELEASE_WRITER_APP_ID }}
          RELEASE_ADMIN_EVIDENCE: ${{ vars.RELEASE_ADMIN_EVIDENCE }}
        run: >-
          python scripts/promote_release.py publish
          --candidate "$CANDIDATE_SHA"
          --expected-stable "$EXPECTED_STABLE"
          --run-id "$GITHUB_RUN_ID"
